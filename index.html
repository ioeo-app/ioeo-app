<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A24">
<title>ioeo</title>
<meta name="description" content="ioeo makes quiet, tidy apps for Android, including the Tide family: Tide Launcher and Tide Browser.">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/lang.js"></script>
<script src="/assets/dock.js" defer></script>
</head>
<body class="has-dock">
<main>
  <div class="top">
    <a class="home" href="/" aria-label="ioeo">
      <span class="mark lg" aria-hidden="true">
        <span class="i"><span class="dot"></span><span class="bar"></span></span>
        <span class="o"></span>
        <span class="e"><span class="ring"></span><span class="fill"></span><span class="cut"></span></span>
        <span class="full"></span>
      </span>
    </a>
    <button class="lang" type="button"><span data-l="en">한국어</span><span data-l="ko">English</span></button>
  </div>

  <section class="hero">
    <p class="lead" data-l="en">Quiet, tidy apps for Android.</p>
    <p class="lead" data-l="ko">조용하고 깔끔한 Android 앱을 만듭니다.</p>
  </section>

  <p class="label">APPS</p>
  <div class="groups">
    <button class="group" type="button" data-open="tide" aria-controls="dock-panel" aria-expanded="false">
      <span class="group-name">Tide</span>
      <span class="group-sub"><span data-l="en">2 apps</span><span data-l="ko">앱 2개</span></span>
      <svg class="group-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
  </div>

  <p class="label">INFO</p>
  <div class="links">
    <a href="/privacy/"><span data-l="en">Privacy Policy</span><span data-l="ko">개인정보처리방침</span></a>
    <a href="mailto:hello@ioeo.app">hello@ioeo.app</a>
  </div>

  <footer>© 2026 ioeo</footer>
</main>

<!-- Bottom search dock, same as Tide Launcher: the panel rises out of it -->
<div class="scrim" hidden></div>
<div class="dock" id="dock">
  <div class="dock-inner">
    <div class="panel" id="dock-panel" role="region" aria-label="Apps">
      <div class="panel-head">
        <span class="handle" aria-hidden="true"></span>
        <p class="panel-title"></p>
      </div>
      <div class="panel-intro" data-for="tide" hidden>
        <p class="panel-name">Tide</p>
        <p data-l="en">A family of apps that share one look and feel. One Tide Pro covers them all.</p>
        <p data-l="ko">같은 모습과 손맛으로 이어지는 앱 묶음. Tide Pro 하나로 모든 Tide 앱을 씁니다.</p>
      </div>
      <ul class="app-list"></ul>
    </div>
    <form class="bar" role="search" autocomplete="off">
      <button class="bar-btn" type="button" aria-label="Search">
        <svg class="ic-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <svg class="ic-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <label class="bar-field">
        <span class="sr">Search apps</span>
        <input type="search" enterkeyhint="search" aria-controls="dock-panel" aria-expanded="false">
      </label>
    </form>
  </div>
</div>
</body>
</html>
